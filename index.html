
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Auto Parts - Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Great Auto Parts - Order Form</h1>

        <form action="#" method="get">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter your first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter your last name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="make">Make:</label>
                <input
                    type="text"
                    id="make"
                    name="make"
                    placeholder="Make"
                    required
                >
            </div>

            <div class="form-group">
                <label for="model">Model:</label>
                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="Model"
                    required
                >
            </div>

            <div class="form-group">
                <label for="year">Year:</label>
                <input
                    type="number"
                    id="year"
                    name="year"
                    placeholder="Year"
                    min="1900"
                    max="2100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="date">Date:</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sparePart">Spare Part:</label>
                <input
                    type="text"
                    id="sparePart"
                    name="sparePart"
                    placeholder="Enter the spare part you need"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    placeholder="Enter the quantity of the spare part you need"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="comment">Comment:</label>
                <textarea
                    id="comment"
                    name="comment"
                    placeholder="Enter your comment"
                    rows="8"
                ></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>

</body>
</html>
